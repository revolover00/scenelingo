name: fill-drive
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours resume
jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib
      - run: python scripts/fill_drive_uploader.py
        env:
          GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
